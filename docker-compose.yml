services:
  
  cassandra:
    image: cassandra:4.0 # Cassandra database image version 4.0
    container_name: cassandra_db
    ports:
      - "9042:9042" # Expose Cassandra's default port for communication with backend service
    environment:
      - CASSANDRA_CLUSTER_NAME=chat-cluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
    volumes:
      - cassandra_data:/var/lib/cassandra

  # backend:
