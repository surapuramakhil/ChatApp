  #     - "8000:80" # Expose port 5000 for HTTP traffic (backend API)
  #     - "8001:443" # Expose port 5001 for HTTPS traffic (optional)
  #   environment:
      # - ASPNETCORE_ENVIRONMENT=Development # Set environment to Development mode for backend service.
      # - CASSANDRA_HOST=cassandra_db # Hostname of Cassandra service in this network.
      # - CASSANDRA_PORT=9042 # Cassandra port where it listens for requests.
      # - CASSANDRA_KEYSPACE=chatapp # Keyspace name in Cassandra.
  #   depends_on:
  #     - cassandra # Ensure Cassandra starts before backend service.

